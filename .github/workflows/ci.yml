name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=shellcheck-py
  SHELLCHECK_VERSION: 0.11.0.1
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.31.1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: pipx run --spec "shellcheck-py==${SHELLCHECK_VERSION}" shellcheck -x adobe tests/test.sh

      - name: zizmor (workflow security)
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --offline --min-severity low .github/workflows

  test:
    name: Tests
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      # macOS runners only support audit mode: connections are logged, not blocked
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # macOS's own bash 3.2, which is what the script runs with
      - name: Tests
        run: /bin/bash tests/test.sh

      # the real commands, on a Mac with no Adobe software: read-only, so nothing is stopped
      - name: Smoke test
        run: |
          ./adobe status
          ./adobe help
          if ./adobe bogus 2>/dev/null; then echo "unknown command accepted"; exit 1; fi
